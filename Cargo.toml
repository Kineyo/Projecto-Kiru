[package]
name = "kiru"
version = "2.0.0"
edition = "2021"
authors = ["kineyo"]
license = "MIT"
description = "Asistente de IA para generación de código y análisis técnico de seguridad ofensiva"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
regex = "1.10"
chrono = "0.4"
walkdir = "2.5"
libc = "0.2"

[[bin]]
name = "kiru"
path = "src/main.rs"
